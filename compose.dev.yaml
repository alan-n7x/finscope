# ============================================================================
# Desenvolvimento: backend com bind mount + hot-reload.
#
# Uso:
#   docker compose -f docker-compose.yml -f compose.dev.yaml up
#   # frontend, em outro terminal:
#   cd frontend && npm run dev        # http://localhost:5173
#
# Ou, para subir os dois de uma vez:
#   ./scripts/dev.sh
#
# O arquivo base (docker-compose.yml) continua sendo o artefato de produção:
# imagem imutável, sem bind mount e sem --reload.
# ============================================================================
services:
  backend:
    # Sem restart automático em dev: se o código quebrar, o erro fica visível.
    restart: "no"
    command:
      - uv
      - run
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    volumes:
      # O código Python vem do host; salvar um arquivo reinicia o Uvicorn.
      - ./app:/app/app:ro
    environment:
      PYTHONUNBUFFERED: "1"
      # Evita __pycache__ gravado como root dentro do bind mount.
      PYTHONDONTWRITEBYTECODE: "1"
